h+=`<h2>PART A — 10 × 1 = 10</h2>`;
s.A.forEach((q,i)=>{h+=`<div class="card q"><p><b>${i+1}.</b> ${q[0]}</p>`+(q[1]?q[1].map((o,j)=>`<label class="o"><input type="radio" name="a${i}" value="${j}"> (${"abcd"[j]}) ${o}</label>`).join(""):`<input type="text" id="a${i}" placeholder="Your answer">`)+`</div>`});
h+=`<h2>PART B — 5 × 7 = 35</h2>`;
s.B.forEach((q,i)=>{h+=`<div class="card q"><p><b>${11+i}.</b></p><div class="tabs"><button class="on" id="b${i}x0" onclick="tab(${i},0)">(a)</button><button id="b${i}x1" onclick="tab(${i},1)">(b)</button></div><p id="bq${i}">${q[0]}</p><textarea id="b${i}t0" placeholder="Write your answer…"></textarea><textarea id="b${i}t1" style="display:none" placeholder="Write your answer…"></textarea></div>`});
h+=`<h2>PART C — 3 × 10 = 30 (Any Three)</h2><p class="sub" id="cc">Selected: 0 / 3</p>`;
s.C.forEach((q,i)=>{h+=`<div class="card q"><label><input type="checkbox" id="cs${i}" onchange="csel(${i})"> <b>${16+i}.</b> ${q}</label><textarea id="ct${i}" style="display:none;margin-top:8px" placeholder="Write your answer…"></textarea></div>`});
h+=`<div class="card"><button onclick="submit()">சமர்ப்பி / Submit Exam</button></div></div>`;
app.innerHTML=h;app.style.padding="0";
timer=setInterval(()=>{left--;const e=document.getElementById("t");if(!e)return;e.textContent=Math.floor(left/3600)+":"+String(Math.floor(left%3600/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(left<=600)e.className="bad";if(left<=0)submit(true)},1000)}
function tab(i,k){document.getElementById("bq"+i).textContent=cur.B[i][k];[0,1].forEach(x=>{document.getElementById("b"+i+"t"+x).style.display=x==k?"":"none";document.getElementById("b"+i+"x"+x).className=x==k?"on":""})}
function csel(i){const n=cur.C.filter((_,k)=>document.getElementById("cs"+k).checked).length;const c=document.getElementById("cs"+i);if(n>3){c.checked=false;alert("Only three questions allowed in Part C.");return}document.getElementById("cc").textContent="Selected: "+Math.min(n,3)+" / 3";document.getElementById("ct"+i).style.display=c.checked?"":"none"}
function submit(auto){if(done)return;if(!auto&&!confirm("Submit the exam? / தேர்வை சமர்ப்பிக்கவா?"))return;done=true;clearInterval(timer);const s=cur;
let mc=0,mt=0,rows="",ab=0,bb=0,cb=0;
s.A.forEach((q,i)=>{if(q[1]){mt++;const r=document.querySelector(`input[name=a${i}]:checked`);const ok=r&&+r.value==q[2];if(ok)mc++;rows+=`<p class="${ok?"ok":"bad"}">${ok?"✔":"✘"} Q${i+1}: ${r?"Your answer: ("+"abcd"[r.value]+") ":"Not answered · "}${ok?"":"Correct: ("+"abcd"[q[2]]+") "+q[1][q[2]]}</p>`}else if(document.getElementById("a"+i).value.trim())ab++});
s.B.forEach((_,i)=>{if(document.getElementById("b"+i+"t0").value.trim()||document.getElementById("b"+i+"t1").value.trim())bb++});
s.C.forEach((_,i)=>{if(document.getElementById("cs"+i).checked&&document.getElementById("ct"+i).value.trim())cb++});
const used=10800-left;window._sm=summary(s,mc,mt,used);const rv=review(s);
app.style.padding="";
app.innerHTML=`<h1>📊 Exam Result</h1><div class="card"><p class="big">${mc} / ${mt}</p><p>Multiple-choice score (auto-graded)</p><p class="sub">Part A short answers attempted: ${ab} / ${10-mt}<br>Part B attempted: ${bb} / 5<br>Part C attempted: ${cb} / 3<br>Time used: ${Math.floor(used/60)} min</p></div><div class="card"><b>MCQ Review</b>${rows||"<p class='sub'>No MCQs in this paper.</p>"}</div><div class="card"><b>📤 ஆசிரியருக்கு முடிவை அனுப்ப / Send result to teacher</b><p class="sub">WhatsApp அழுத்தி ஆசிரியரைத் தேர்ந்தெடுத்து அனுப்பவும். (நீண்ட பதில்கள் சுருக்கப்படும்)</p><button onclick="wa()">WhatsApp</button> <button class="s" onclick="cp()">Copy</button></div>${rv}<button onclick="home()">மற்றொரு தேர்வு / Another Paper</button> <button class="s" onclick="intro(${S.indexOf(s)})">Retake</button>`;window.scrollTo(0,0)}
home();
</script>
</body>
</html>
